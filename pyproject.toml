[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tradegate"
version = "0.1.0"
description = "Order-validation gates for an automated trader; a stale book refuses everything"
requires-python = ">=3.9"

[project.optional-dependencies]
dev = ["pytest"]
live = ["anthropic"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
