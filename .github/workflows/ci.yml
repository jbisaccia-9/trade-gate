name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: python -m tradegate check orders/example_buy.json
      # The excluded order must be REFUSED - CI asserts the refusal.
      - run: "! python -m tradegate check orders/refused_excluded.json"
      - run: python -m tradegate eval
      - run: python -m tradegate overseer
      # A hallucinating overseer must be refused by the report-grounding gate.
      - run: "! python -m tradegate overseer hallucinating"
